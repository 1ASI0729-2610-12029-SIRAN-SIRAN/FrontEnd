<form [formGroup]="babyForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" type="text" formControlName="name" class="form-control">
    <div class="error" *ngIf="babyForm.get('name')?.invalid && babyForm.get('name')?.touched">Required</div>
  </div>

  <div class="form-group">
    <label for="birthday">Birthday</label>
    <input id="birthday" type="date" formControlName="birthday" class="form-control">
    <div class="error" *ngIf="babyForm.get('birthday')?.invalid && babyForm.get('birthday')?.touched">Required</div>
  </div>

  <div class="form-group">
    <label for="gender">Gender</label>
    <select id="gender" formControlName="gender" class="form-control">
      <option value="">Select</option>
      <option value="Masculino">Male</option>
      <option value="Femenino">Female</option>
    </select>
    <div class="error" *ngIf="babyForm.get('gender')?.invalid && babyForm.get('gender')?.touched">Required</div>
  </div>

  <div class="form-actions">
    <button type="button" (click)="onCancel()">Cancel</button>
    <button type="submit" [disabled]="babyForm.invalid">Save</button>
  </div>
</form>
