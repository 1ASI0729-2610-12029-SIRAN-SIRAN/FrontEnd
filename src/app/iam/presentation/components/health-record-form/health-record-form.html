

<div class="form-container">

  <div class="form-header">
    <a routerLink="/monitoring/records" class="btn-back">
      <i class="ti ti-arrow-left"></i> Volver
    </a>
    <div>
      <h2 class="form-title"><i class="ti ti-activity"></i> Nuevo HealthRecord</h2>
      <p class="form-sub">Registra los signos vitales del neonato</p>
    </div>
  </div>

  <div class="form-card">

    <div *ngIf="errorMsg" class="error-banner">
      <i class="ti ti-alert-circle"></i> {{ errorMsg }}
    </div>

    <form (ngSubmit)="onSubmit()" #recordForm="ngForm">

      <!-- Fila 1: Temperatura + Peso -->
      <div class="form-row">
        <div class="form-field">
          <label for="temperature">Temperatura (°C) <span class="required">*</span></label>
          <input
            id="temperature"
            type="number"
            step="0.1"
            min="30" max="43"
            placeholder="36.5"
            [(ngModel)]="form.temperature"
            name="temperature"
            required
          />
        </div>
        <div class="form-field">
          <label for="weight">Peso (kg) <span class="required">*</span></label>
          <input
            id="weight"
            type="number"
            step="0.01"
            min="0" max="10"
            placeholder="3.45"
            [(ngModel)]="form.weight"
            name="weight"
            required
          />
        </div>
      </div>

      <!-- Fila 2: SpO2 + FC -->
      <div class="form-row">
        <div class="form-field">
          <label for="oxygenSaturation">SpO₂ — Saturación O₂ (%) <span class="required">*</span></label>
          <input
            id="oxygenSaturation"
            type="number"
            step="1"
            min="50" max="100"
            placeholder="97"
            [(ngModel)]="form.oxygenSaturation"
            name="oxygenSaturation"
            required
          />
        </div>
        <div class="form-field">
          <label for="heartRate">Frecuencia cardíaca (lpm)</label>
          <input
            id="heartRate"
            type="number"
            step="1"
            min="0" max="300"
            placeholder="120"
            [(ngModel)]="form.heartRate"
            name="heartRate"
          />
        </div>
      </div>

      <!-- Fila 3: FR -->
      <div class="form-row">
        <div class="form-field">
          <label for="respiratoryRate">Frecuencia respiratoria (rpm)</label>
          <input
            id="respiratoryRate"
            type="number"
            step="1"
            min="0" max="100"
            placeholder="42"
            [(ngModel)]="form.respiratoryRate"
            name="respiratoryRate"
          />
        </div>
      </div>

      <!-- Acciones -->
      <div class="form-actions">
        <a routerLink="/monitoring/records" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting || recordForm.invalid">
          <i class="ti ti-device-floppy"></i>
          {{ isSubmitting ? 'Guardando...' : 'Guardar registro' }}
        </button>
      </div>

    </form>
  </div>
</div>
