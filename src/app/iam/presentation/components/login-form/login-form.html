<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <!--TODO: TRANSLATE LATER-->
    <h2>Log in</h2>

    <div class="form-group">
      <!--TODO: TRANSLATE LATER-->
      <label for="email">Email Address</label>
      <input type="email" id="email"
             formControlName="email" class="form-control"
             [class.is-valid]="email?.invalid && email?.touched"
      />
      <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
        <!--TODO: TRANSLATE LATER-->
        <span *ngIf="email?.errors?.['required']">Address is required</span>
        <!--TODO: TRANSLATE LATER-->
        <span *ngIf="email?.errors?.['email']">Address format is invalid</span>
      </div>
    </div>

    <div class="form-group">
      <!--TODO: TRANSLATE LATER-->
      <label for="password">Password</label>
      <input type="password" id="password"
             formControlName="password" class="form-control"
             [class.is-invalid]="password?.invalid && password?.touched"
      />
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button type="submit" class="button button-primary" [disabled]="loading">
        <!--TODO: TRANSLATE LATER-->
        {{ loading? 'Validating...' : 'Next'}}
      </button>
    </div>

    <!--TODO: TRANSLATE LATER-->
    <p class="text-center mt-3">Do you don't have a count? <a routerLink="/register">Register</a></p>

  </form>
</div>
